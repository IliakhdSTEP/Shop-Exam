
<section class="page">
  <h2>პროდუქტები</h2>

  <div class="toolbar">
    <input class="search" type="search" placeholder="ძებნა..." [(ngModel)]="search" />
    <nav class="categories">
      @for (c of categories; track c) {
       <!-- queryparams გავასწორე  -->
        <a [routerLink]="[]" [queryParams]="{ category: c }" [class.active]="category() === c">{{ c }}</a>
      }
    </nav>
  </div>

  @let items = visibleProducts();
  @if (items.length === 0) {
    <p class="empty">პროდუქტი ვერ მოიძებნა</p>
  } @else {
    <div class="grid">
      <!-- for-ს დაემატა track და ახლა პროდუქტებს სწორად ამოიცნობს -->
      @for (p of items; track p.id) {
        <!-- add შევცვალე addtocart-ით რო სახელები დაემთხვას ახლა -->
        <app-product-card
          [product]="p"
          (addToCart)="addToCart($event)"
          (viewDetails)="openDetails($event)"
        />
      }
    </div>
  }
</section>
